name: Build BrainBuddy APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Gradle Properties
        run: |
          mkdir -p ~/.gradle
          if [ -f .github/gradle-ci.properties ]; then
            cp .github/gradle-ci.properties ~/.gradle/gradle.properties
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Check Keystore Secrets (if configured)
        id: check_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
            {
              printf 'storeFile=keystore/release.jks\n'
              printf 'storePassword=%s\n' "$STORE_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            } > keystore.properties
            echo "Release keystore configured successfully."
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore configured; building unsigned release or debug APK."
          fi

      - name: Run Unit Tests
        run: |
          ./gradlew test -x spotlessCheck --stacktrace || {
            echo "=== UNIT TEST FAILURES ==="
            find . -type f -name "*.xml" -path "*/test-results/*" -exec echo "--- {} ---" \; -exec cat {} \;
            exit 1
          }

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'all' || inputs.build_type == 'debug' }}
        run: ./gradlew :app:assembleDebug

      - name: Build Release APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'all' || inputs.build_type == 'release' }}
        run: ./gradlew :app:assembleRelease

      - name: Prepare APK outputs
        run: |
          mkdir -p apks
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk apks/BrainBuddy-debug.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk apks/BrainBuddy-release.apk
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk apks/BrainBuddy-release.apk
          fi
          ls -la apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BrainBuddy-APKs
          path: apks/*.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.2
          name: BrainBuddy v1.7.2
          draft: false
          prerelease: false
          body: |
            ## BrainBuddy v1.7.2 — Official Release

            ### Features
            - Living Cartoon Brain Mascot with 4 progressive emotional fatigue poses
            - Trembling and shivering animation on severe fatigue (>= 80)
            - Dual-rate cognitive fatigue engine (screen time vs rapid reel dopamine fatigue)
            - Non-intrusive 20-minute break reminder overlay
            - Supported apps: Instagram Reels, YouTube Shorts, TikTok, Facebook Reels, Snapchat Spotlight, and Likee
            - 100% offline, zero internet permission, privacy guaranteed

            ### Installation Note
            Download `BrainBuddy-debug.apk` below for direct installation on your Android phone.
          files: apks/*.apk

